    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#b8c1ff" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
